<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="75%" cy="90%" r="65%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="8%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="55%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#a5f3fc" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <g filter="url(#soft)">
    <ellipse cx="320" cy="150" rx="420" ry="300" fill="url(#g1)"/>
    <ellipse cx="1360" cy="200" rx="450" ry="320" fill="url(#g2)"/>
    <ellipse cx="1200" cy="900" rx="500" ry="330" fill="url(#g3)"/>
    <ellipse cx="130" cy="850" rx="400" ry="280" fill="url(#g4)"/>
    <ellipse cx="820" cy="520" rx="300" ry="200" fill="url(#g5)"/>
  </g>

  <!-- حلقه‌های تزئینی نرم -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05">
    <circle cx="1300" cy="230" r="180" stroke-width="1.4"/>
    <circle cx="1300" cy="230" r="260" stroke-width="1"/>
    <circle cx="280" cy="800" r="150" stroke-width="1.4"/>
    <circle cx="280" cy="800" r="230" stroke-width="1"/>
    <circle cx="1450" cy="820" r="110" stroke-width="1.2"/>
  </g>

  <!-- خطوط اتصال ظریف -->
  <g stroke="#a5f3fc" stroke-opacity="0.10" stroke-width="1.2" fill="none">
    <path d="M0,700 C300,600 500,760 800,680 S1250,560 1600,640"/>
    <path d="M0,240 C350,320 620,180 960,260 S1380,340 1600,240"/>
  </g>

  <!-- نمادهای تیک محو در پس‌زمینه (نماد تضمین کیفیت) -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1180 620 l24 24 44-52"/>
    <path d="M170 340 l20 20 36-44"/>
    <path d="M1420 480 l18 18 32-40"/>
  </g>
</svg>
